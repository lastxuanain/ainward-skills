name: Sync upstream modern-web-guidance

on:
  schedule:
    # Check upstream daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-modern-web-guidance
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch upstream and sync skills/modern-web-guidance
        id: sync
        run: |
          set -euo pipefail

          UPSTREAM_DIR="${RUNNER_TEMP}/upstream-mwg"
          rm -rf "$UPSTREAM_DIR"

          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/GoogleChrome/modern-web-guidance.git \
            "$UPSTREAM_DIR"
          git -C "$UPSTREAM_DIR" sparse-checkout set --no-cone \
            /skills/modern-web-guidance \
            /LICENSE \
            /NOTICE \
            '!skills/modern-web-guidance/guides'

          test -f "$UPSTREAM_DIR/skills/modern-web-guidance/SKILL.md"
          test -f "$UPSTREAM_DIR/LICENSE"

          UPSTREAM_SHA="$(git -C "$UPSTREAM_DIR" rev-parse HEAD)"
          UPSTREAM_SHORT="$(git -C "$UPSTREAM_DIR" rev-parse --short HEAD)"

          mkdir -p skills/modern-web-guidance
          rsync -rlc --delete \
            --exclude='guides/' \
            --exclude='README.md' \
            --exclude='README.zh-CN.md' \
            --exclude='LICENSE' \
            --exclude='NOTICE' \
            "$UPSTREAM_DIR/skills/modern-web-guidance/" \
            skills/modern-web-guidance/

          cp "$UPSTREAM_DIR/LICENSE" skills/modern-web-guidance/LICENSE
          rm -f skills/modern-web-guidance/NOTICE
          if [ -f "$UPSTREAM_DIR/NOTICE" ]; then
            cp "$UPSTREAM_DIR/NOTICE" skills/modern-web-guidance/NOTICE
          fi

          STATUS="$(git status --porcelain -- skills/modern-web-guidance/)"
          if [ -z "$STATUS" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "skills/modern-web-guidance is already up to date with upstream ($UPSTREAM_SHORT)."
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          echo "upstream_short=$UPSTREAM_SHORT" >> "$GITHUB_OUTPUT"

          {
            echo "changed_files<<GHA_CHANGED_EOF"
            echo "$STATUS"
            echo "GHA_CHANGED_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update sync Pull Request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
          UPSTREAM_SHORT: ${{ steps.sync.outputs.upstream_short }}
          CHANGED_FILES: ${{ steps.sync.outputs.changed_files }}
        run: |
          set -euo pipefail

          SYNC_BRANCH="chore/sync-modern-web-guidance"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$SYNC_BRANCH"
          git add -A skills/modern-web-guidance/
          git commit -m "chore(modern-web-guidance): sync upstream ($UPSTREAM_SHORT)"

          if git ls-remote --exit-code --heads origin "$SYNC_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$SYNC_BRANCH" --depth=1
            if git diff --quiet "origin/$SYNC_BRANCH" HEAD -- skills/modern-web-guidance/; then
              echo "Open branch $SYNC_BRANCH already matches upstream ($UPSTREAM_SHORT); skipping push."
              exit 0
            fi
          fi

          git push --force origin "$SYNC_BRANCH"

          PR_TITLE="chore(modern-web-guidance): sync upstream ($UPSTREAM_SHORT)"
          PR_BODY="$(cat <<EOF
          Automated sync of \`skills/modern-web-guidance\` (excluding \`guides/\`) and upstream \`LICENSE\` from [\`GoogleChrome/modern-web-guidance\`](https://github.com/GoogleChrome/modern-web-guidance/commit/${UPSTREAM_SHA}).

          ### Changed Files
          \`\`\`text
          ${CHANGED_FILES}
          \`\`\`

          ### Review Checklist
          - Verify \`skills/modern-web-guidance/SKILL.md\` changes for any unexpected commands or scope drift.
          - Confirm upstream Apache-2.0 / CC-BY 4.0 license & attribution files remain intact.
          EOF
          )"

          EXISTING_PR="$(gh pr list --head "$SYNC_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --base main \
              --head "$SYNC_BRANCH" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"
          else
            gh pr edit "$EXISTING_PR" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"
          fi
